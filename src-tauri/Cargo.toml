[package]
name = "texdesk"
version = "0.1.0"
description = "A lightweight LaTeX editor for macOS"
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "texdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
ignore = "0.4"
tauri-plugin-clipboard-manager = "2"
libc = "0.2"
sha2 = "0.10"
flate2 = "1"
trash = "5.2.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSRange"] }
security-framework = "3"
